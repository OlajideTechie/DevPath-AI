name: CI and Render deployment

on:
  pull_request:
    branches:
      
  push:
    branches:
  
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: devpath
          POSTGRES_USER: ${{ vars.CI_POSTGRES_USER || 'devpath' }}
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'devpath_ci_only' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U \"$POSTGRES_USER\" -d devpath"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/devpath
      SPRING_DATASOURCE_USERNAME: ${{ vars.CI_POSTGRES_USER || 'devpath' }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'devpath_ci_only' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run backend tests
        run: ./mvnw --batch-mode test

  deploy-backend:
    name: Deploy backend to Render
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Set the RENDER_DEPLOY_HOOK_URL GitHub Actions secret to enable backend deployment."
            exit 1
          fi

          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST "$RENDER_DEPLOY_HOOK_URL" 2>/dev/null) || {
            echo "Could not reach the Render deploy hook."
            exit 1
          }

          case "$status" in
            2*) echo "Render accepted the backend deploy request (HTTP $status)." ;;
            *)
              echo "Render deploy hook returned HTTP $status."
              exit 1
              ;;
          esac
