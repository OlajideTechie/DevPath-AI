spring.application.name=devpath-backend
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.port=${PORT:${SERVER_PORT:8080}}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=false
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.ai.base-url=${AI_PROVIDER_BASE_URL:https://api.openai.com/v1}
app.ai.api-key=${AI_PROVIDER_API_KEY:}
app.ai.model=${AI_PROVIDER_MODEL:gpt-4o-mini}
app.ai.connect-timeout=${AI_PROVIDER_CONNECT_TIMEOUT:3s}
app.ai.request-timeout=${AI_PROVIDER_REQUEST_TIMEOUT:20s}
app.ai.demo-mode=${AI_DEMO_MODE:false}