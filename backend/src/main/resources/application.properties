spring.application.name=devpath-backend
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/devpath}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:devpath}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:devpath_local_only}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=false
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
